org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
# Configuration cache is off: it is a build-speed nicety that adds failure surface
# with the Kotlin and Android plugins, and buys nothing on a clean CI runner.
