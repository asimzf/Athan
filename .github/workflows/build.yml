name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug --console=plain 2>&1 | tee /tmp/build.log

      # Gradle's own failure output buries Kotlin errors under a long stack trace, so
      # repeat just the diagnostics at the end of the log where they are readable.
      - name: Compiler diagnostics
        if: failure()
        run: |
          echo "::group::Kotlin and resource errors"
          grep -E "^(e|w): |error:|FAILURE:|\* What went wrong:|Execution failed" /tmp/build.log \
            | head -120 || echo "no diagnostic lines matched"
          echo "::endgroup::"

      # The debug APK is signed with the standard debug keystore, so it installs on a
      # phone directly. A release build would come out unsigned and refuse to install.
      - name: Name the APK after the commit
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/salaah-alarm-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: salaah-alarm-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
